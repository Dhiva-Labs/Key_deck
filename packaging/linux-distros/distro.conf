# Package metadata for the other-distribution packages (.rpm, Arch, AppImage,
# AUR PKGBUILD). Sourced by bash from packaging/linux-distros/pack.sh,
# verify.sh and packaging/arch/aur.sh. Keep it in step with the .deb
# (desktop/tool/build_deb.sh).

NAME=keydeck                 # package name, the same as the .deb's
APP_NAME=KeyDeck             # AppImage file name and display name
GITHUB_REPO=Dhiva-Labs/Key_deck
TAG_PREFIX=''                # release tags are the bare version (0.2.1)
SUMMARY='Phone macro pad host for the desktop'
DESCRIPTION='KeyDeck turns a phone into a programmable macro pad. This is the desktop host: it shows the pairing QR code, lets you program every key and injects the keystrokes. Pair over WiFi or Bluetooth. Keystroke injection needs xdotool (X11) or ydotool (Wayland).'
MAINTAINER='Dhiva Labs <dhivakar1010@gmail.com>'
HOMEPAGE=https://github.com/Dhiva-Labs/Key_deck
# The .deb's copyright file says proprietary freeware; there is no licence
# file in the repository.
LICENSE=LicenseRef-proprietary
LICENSE_FILE=''

# Files of the .deb tree that the other formats leave out. libdartjni.so
# comes from the jni plugin (an Android dependency); CMake builds it only
# because the CI runner has a JDK, and it links that runner's libjvm.so by
# absolute path. Nothing loads it on desktop Linux, and shipping it would
# make the rpm require a JVM.
EXCLUDE=(usr/lib/keydeck/lib/libdartjni.so)

# rpm: shared-library dependencies are worked out from the ELF files. List
# only what the app runs (tools it executes), as file paths. The app looks
# for its keystroke tool with `which` (and fails without it); the tools
# themselves are the .deb's Recommends: xdotool on X11, ydotool on Wayland.
# Flutter's engine also opens libEGL and libGLESv2 at run time (through
# libepoxy, so they are no ELF dependencies): required by capability, which
# libglvnd provides on Fedora and openSUSE alike.
RPM_REQUIRES=(/usr/bin/which 'libEGL.so.1()(64bit)' 'libGLESv2.so.2()(64bit)')
RPM_RECOMMENDS=('(xdotool or ydotool)')
# Arch: package names, written by hand (Arch has no soname dependencies for
# most libraries). CI's ldd check on archlinux:latest keeps this honest.
ARCH_DEPENDS=(gtk3 which libglvnd)
ARCH_OPTDEPENDS=('xdotool: type hotkeys and text on X11' 'ydotool: type hotkeys and text on Wayland')
ARCH_INDEPENDENT=0           # 1 for pure-Python/shell packages (noarch / any)

# AppImage (GUI apps): paths relative to the installed tree.
APPIMAGE=1
EXEC=usr/lib/keydeck/keydeck_desktop
DESKTOP=usr/share/applications/keydeck.desktop
ICON=usr/share/icons/hicolor/256x256/apps/keydeck.png
APPRUN_ENV=''                # /usr/bin/keydeck only execs the binary, no env

# Smoke tests run in each distribution container by verify.sh, as the .deb's
# smoke run: the "KeyDeck" window must show (Flutter rendered its first
# frame) and the Dart PadServer must listen on its TCP port, 8737 (0x2221).
GUI_CMD=keydeck
GUI_ARGS=''
SMOKE_SETUP=''
smoke_ready() {
  xdotool search --onlyvisible --name '^KeyDeck$' > /dev/null &&
    { cat /proc/net/tcp; cat /proc/net/tcp6 2> /dev/null || :; } |
    awk '$4 == "0A" && $2 ~ /:2221$/ { up = 1 } END { exit !up }'
}
SMOKE_READY=smoke_ready
SMOKE_SECONDS=90
SMOKE_CMD=''
SMOKE_EXPECT=''
